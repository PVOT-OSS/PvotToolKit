name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    uses: PVOT-OSS/workflows/.github/workflows/android-build.yml@main
    with:
      java-version: "21"
      gradle-tasks: "build --continue"
      upload-artifacts: true
