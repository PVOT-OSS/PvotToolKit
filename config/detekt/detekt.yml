complexity:
  LongMethod:
    # Composables are bounded by the Compose nesting and emitter rules below instead.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20

coroutines:
  InjectDispatcher:
    # Inert without type resolution; kept on so it enforces once that is enabled.
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  GlobalCoroutineUsage:
    active: true

exceptions:
  TooGenericExceptionCaught:
    # Broad catches need a local suppression at the call site, not a project-wide opt-out.
    active: true
  SwallowedException:
    active: true

naming:
  MatchingDeclarationName:
    # Navigation files pair a route with its extensions and are named for the pair.
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # PascalCase is allowed only for design tokens such as OuterRadius, not ordinary properties.
    constantPattern: '[A-Z][_A-Z0-9]*'
    privatePropertyPattern: '_?[A-Z][_A-Za-z0-9]*|_?[a-z][A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    # ktfmt owns line length.
    active: false
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

# Rule ids come from the ruleset's bundled config, as they change between releases.
Compose:
  CompositionLocalAllowlist:
    # Empty on purpose: every colour is a Material role on the Pvot theme.
    allowedCompositionLocals: []
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableNestingDepth:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  StateParam:
    active: true
  UnnecessaryComposable:
    active: true
  UnstableCollections:
    # Off so the model layer is not wrapped in ImmutableList to satisfy a linter.
    active: false
  VarsWithoutStateBacking:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
