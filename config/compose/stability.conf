// Classes the Compose compiler cannot prove stable, but which are immutable by
// construction: every instance is rebuilt wholesale by a repository or view
// model and never mutated in place, so structural equality is a correct change
// signal. Declared here rather than with @Immutable so the pure-Kotlin modules
// keep no dependency on Compose.
//
// Verify a claim rather than trusting it:
//   ./gradlew :feature:news:compileDebugKotlin -PcomposeMetrics
//   grep UiState feature/news/build/compose-metrics/*-classes.txt

// Domain snapshots. Unstable only because they carry List properties.
org.prauga.toolkit.core.model.*
org.prauga.toolkit.core.battery.*

// Screen state. Each is replaced on every emission, never edited in place.
org.prauga.toolkit.feature.monitor.MetricHistory
org.prauga.toolkit.feature.monitor.MonitorUiState
org.prauga.toolkit.feature.deviceinfo.DeviceInfoUiState
org.prauga.toolkit.feature.deviceinfo.SensorsUiState
org.prauga.toolkit.feature.discover.DiscoverUiState
org.prauga.toolkit.feature.more.MoreUiState
org.prauga.toolkit.feature.news.NewsUiState
org.prauga.toolkit.feature.news.NewsUiState.Ready
org.prauga.toolkit.feature.news.NewsUiState.Failed
