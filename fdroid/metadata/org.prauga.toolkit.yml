PackageName: org.prauga.toolkit
Name: Pvot Toolkit
Summary: Live CPU, battery and hardware readouts without root, for StormBreaker kernels
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/PvotToolKit
IssueTracker: https://github.com/PVOT-OSS/PvotToolKit/issues
WebSite: ""
Categories:
  - System
CurrentVersion: "1.0.0"
CurrentVersionCode: 10000
Description: |
  Pvot Toolkit is the companion app for Team StormBreaker's open-source custom
  kernels. Without root it shows live per-core CPU load and frequencies read
  per cpufreq policy, memory, battery, network, storage, deep sleep and thermal
  status; full hardware details down to cameras, codecs, sensors and boot
  state; the project's news; and an optional battery monitor that tracks
  active and idle drain. No account, no ads, no tracking; everything it reads
  about the device stays on the device.

RepoType: git
Repo: https://github.com/PVOT-OSS/PvotToolKit.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: v1.0.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
